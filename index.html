<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>GDZ-calc — калькулятор по алгебре 7 класса</title>
<meta name="description" content="Калькулятор по учебнику алгебры 7 класса: выберите формулу, введите числа и получите ответ. Плюс решатель текстовых задач и числовые промежутки.">
<meta name="theme-color" content="#f5f6f8">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23256bd8'/><text x='16' y='23' font-size='19' text-anchor='middle' fill='white' font-family='Georgia'>∑</text></svg>">
</head>
<body>

<div class="app">

  <!-- верхняя строка: название и переключение разделов -->
  <header class="bar">
    <div class="bar-title">
      <span class="logo" aria-hidden="true">∑</span>
      <h1>GDZ-calc</h1>
    </div>
    <nav class="seg" role="tablist" aria-label="Разделы">
      <button class="seg-btn" role="tab" id="tab-formulas" aria-controls="panel-formulas" aria-selected="true" title="Формулы">Формулы</button>
      <button class="seg-btn" role="tab" id="tab-tasks" aria-controls="panel-tasks" aria-selected="false" title="Решение задач">Задачи</button>
      <button class="seg-btn" role="tab" id="tab-intervals" aria-controls="panel-intervals" aria-selected="false" title="Промежутки">Промежутки</button>
    </nav>
  </header>

  <main>

    <!-- ============================== ФОРМУЛЫ ============================== -->
    <section class="panel active" id="panel-formulas" role="tabpanel" aria-labelledby="tab-formulas">

      <div class="picker">
        <div class="search">
          <input type="text" id="formula-search" placeholder="Найти формулу" autocomplete="off" aria-label="Поиск формулы">
          <button class="search-clear" id="search-clear" type="button" aria-label="Очистить">×</button>
        </div>
        <div class="chapters" id="chapter-filter" role="group" aria-label="Глава"></div>
        <div class="count-note" id="formula-count"></div>
        <div class="list" id="formula-list"></div>
      </div>

      <div class="calc" id="formula-detail">
        <div class="calc-empty">
          <div class="calc-empty-mark">∑</div>
          <p>Выберите формулу из списка</p>
        </div>
      </div>

    </section>

    <!-- =============================== ЗАДАЧИ ============================== -->
    <section class="panel" id="panel-tasks" role="tabpanel" aria-labelledby="tab-tasks">

      <div class="picker">
        <div class="solver">
          <textarea id="task-input" rows="4" placeholder="Вставьте условие задачи" aria-label="Условие задачи"></textarea>
          <div class="solver-actions">
            <button class="btn primary" id="task-solve">Решить</button>
            <button class="btn" id="task-clear">Очистить</button>
          </div>
          <div class="count-note">Примеры</div>
          <div class="examples" id="task-examples"></div>
        </div>
      </div>

      <div class="calc" id="task-result">
        <div class="calc-empty">
          <div class="calc-empty-mark">=</div>
          <p>Здесь появится ответ</p>
        </div>
      </div>

    </section>

    <!-- ============================= ПРОМЕЖУТКИ ============================ -->
    <section class="panel" id="panel-intervals" role="tabpanel" aria-labelledby="tab-intervals">

      <div class="picker">
        <div class="solver">
          <label class="field-label" for="interval-input">Промежуток</label>
          <input class="text-input" type="text" id="interval-input" value="[−2; 5)" placeholder="[−2; 5) · (a; +∞) · x ⩾ −2" autocomplete="off">
          <div class="solver-actions">
            <button class="btn primary" id="interval-go">Показать</button>
          </div>
          <div class="count-note">Быстрый выбор</div>
          <div class="examples" id="interval-quick"></div>

          <div class="sep"></div>

          <label class="field-label">Пересечение и объединение</label>
          <input class="text-input" type="text" id="interval-a" value="[−2; 5)" aria-label="Первый промежуток">
          <input class="text-input" type="text" id="interval-b" value="(0; 8]" aria-label="Второй промежуток" style="margin-top:8px">
          <div class="solver-actions">
            <button class="btn" id="interval-both">Найти</button>
          </div>
          <div id="interval-both-output"></div>
        </div>
      </div>

      <div class="calc" id="interval-output">
        <div class="calc-empty">
          <div class="calc-empty-mark">↔</div>
          <p>Введите промежуток</p>
        </div>
      </div>

    </section>

  </main>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
